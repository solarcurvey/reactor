<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>REACTOR E2E Wallet</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
      h1 { font-size: 16px; }
      p, label { font-size: 13px; color: #bbb; }
      button { margin: 6px 6px 0 0; padding: 8px 12px; border-radius: 999px; border: 0; cursor: pointer; }
      #confirm { background: #7ee8ff; color: #111; }
      #reject { background: #3f3f46; color: #fff; }
      #meta { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>MetaMask / Rabby style prompt</h1>
    <p id="status">No pending request</p>
    <p id="meta"></p>
    <label><input type="checkbox" id="locked" /> Locked</label>
    <div>
      <button id="unlock" type="button">Unlock</button>
      <button id="acct0" type="button">Account #0</button>
      <button id="acct1" type="button">Account #1</button>
    </div>
    <div>
      <button id="confirm" type="button">Confirm</button>
      <button id="reject" type="button">Reject</button>
    </div>
    <script src="notification.js"></script>
  </body>
</html>
