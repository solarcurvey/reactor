name: deploy-aws-relay

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reactor-aws-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Require deployment variables
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_RELAY_DEPLOY_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ vars.AWS_RELAY_REGION }}
          NAME_PREFIX: ${{ vars.AWS_RELAY_NAME_PREFIX }}
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" || { echo "AWS_RELAY_DEPLOY_ROLE_ARN repository variable is required" >&2; exit 1; }
          test -n "$AWS_REGION_VALUE" || { echo "AWS_RELAY_REGION repository variable is required" >&2; exit 1; }
          test -n "$NAME_PREFIX" || { echo "AWS_RELAY_NAME_PREFIX repository variable is required" >&2; exit 1; }
      - name: Build reviewed relay bundle
        run: pnpm build:aws-relay
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_RELAY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELAY_REGION }}
      - name: Replace Lambda code only
        shell: bash
        env:
          NAME_PREFIX: ${{ vars.AWS_RELAY_NAME_PREFIX }}
        run: |
          set -euo pipefail
          ZIP=fileb://dist/reactor-aws-relay.zip
          for fn in maintenance-authorizer relay-a relay-b; do
            aws lambda update-function-code \
              --function-name "${NAME_PREFIX}-${fn}" \
              --zip-file "$ZIP" \
              --publish >/tmp/reactor-aws-deploy-${fn}.json
            aws lambda wait function-updated --function-name "${NAME_PREFIX}-${fn}"
          done
          echo "Reviewed AWS relay code deployed to all three functions. IAM/KMS/config were not mutable by this role."
