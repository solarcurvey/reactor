name: keeper-lease-pg

on:
  push:
  pull_request:

# Public-fork hardening (Refs #72). Compatible with #69 three-tier CI:
# keep contents:read + persist-credentials:false when folding into ci.yml.
# No pull_request_target. No secrets in this test-only workflow.
permissions:
  contents: read

jobs:
  two-worker-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor_lease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor_lease"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reactor:reactor@127.0.0.1:5432/reactor_lease
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Two-worker Keeper lease fencing on real Postgres
        run: pnpm --filter indexer test:pg-lease
