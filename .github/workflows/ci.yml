# Three-tier CI (issue #69). Cost/frequency refactor only — do not weaken
# #15 / #17 / #18 production-readiness commands.
#
# Public-fork harden from #74 (Refs #72): workflow contents:read already
# required here; every checkout must set persist-credentials: false.
# No pull_request_target. No secrets.
#
# Tiers
#   fast  — every meaningful PR update (draft included): unit / docs:check /
#           cheap security. Targeted Foundry only when Solidity paths change.
#   full  — force-full: label `ci-full`, workflow_dispatch (default full),
#           or push to main. Ordinary non-draft PRs also go full unless the
#           diff is docs-only/trivial. Force-full ignores path filters.
#   main  — push to main only. One integrated post-merge path. Unrelated PRs
#           cannot cancel it.
#
# Feature-branch `push` is intentionally omitted (PR-event only). Genuine
# exceptions: this file's `push: branches: [main]` and `workflow_dispatch`.
#
# Sibling heavy gates: #35 E2E is job `e2e-release-gate` (full/main);
# #36 visual/a11y is job `web-qa` (full/main); #39 obs is job `obs-ui`
# (full/main). Later heavy gates must add jobs here with
# `if: needs.decide.outputs.full == 'true'` — never a second push+pull_request
# workflow. #37 page-budget is cheap (SQLite unit) and lands as a fast job.
# Nightly/cron matrices stay off while pre-traction.
#
# #17 leftover extras land here (not a second workflow):
#   docs:links — cheap check also in test:lib; full-only job so ci-ok
#     cannot succeed if it is skipped.
#   Playwright smoke + interactive — full-only job `web`.
#   Safe genesis builder tests — required via test:lib (not a separate job).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "fast or full. Default full — the documented manual release gate."
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

concurrency:
  # PRs share one group so a force-push cancels obsolete runs.
  # Main / dispatch group by SHA so an unrelated PR cannot cancel post-merge
  # verification, and a later main commit cannot hide a previous SHA.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  decide:
    name: decide-tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.out.outputs.full }}
      force_full: ${{ steps.out.outputs.force_full }}
      solidity: ${{ steps.out.outputs.solidity }}
      docs_only: ${{ steps.out.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch PR base for path filter
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }} || echo "base fetch failed; path filter will fail-safe"
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-decide.sh

  # Visible cheap gate. Always executes commands (never skip-as-pass).
  constants-version-deployments:
    name: constants-version-deployments
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      # Includes @reactor/sanctions fixtures via test:lib. Live OFAC HTTPS is
      # pnpm test:sanctions:network (SANCTIONS_NETWORK=1) — not this job.
      - name: Unit + docs:check + docs:links + cheap security + CI-cost invariants
        run: pnpm test:lib

  # Required #37 page-budget gate. Cheap (SQLite seed + unit asserts).
  # Always-on fast job (no `if:` skip). Also listed in ci-ok (skipped ≠ pass).
  # File stays in pnpm test:lib.
  page-budget:
    name: page-budget
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: 500-vs-4k HTTP/RPC budgets, abort, SSE patch, no focus refetch
        run: pnpm test:page-budget

  foundry-targeted:
    name: foundry-targeted
    needs: decide
    if: needs.decide.outputs.full != 'true' && needs.decide.outputs.solidity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOUNDRY_PROFILE: default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-foundry
      - name: Targeted Foundry (default fuzz; skip when Solidity did not change)
        working-directory: contracts
        run: forge test -vv
      - name: EIP-170 size guard
        run: pnpm size:guard

  solidity:
    name: solidity + size-guard
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-foundry
      - name: Forge tests (unit / attack / integration / invariant; CI fuzz 1024)
        working-directory: contracts
        run: forge test -vv
      - name: Attack suite
        working-directory: contracts
        run: |
          set -euo pipefail
          mapfile -t files < <(find test/attack -type f -name '*.t.sol' | LC_ALL=C sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Attack suite: no test/attack/*.t.sol files" >&2
            exit 1
          fi
          printf 'Attack suite files (%s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # Foundry 1.8: [PATH] is a single-file shortcut; --match-path cannot repeat.
          for f in "${files[@]}"; do
            echo "=== $f ==="
            forge test "$f" -vv
          done
      - name: CREATE2 hook bits
        working-directory: contracts
        run: forge test --match-path test/unit/LockAndBuyback.t.sol --match-test test_hookBits -vv
      - name: EIP-170 size guard (Factory runtime ≤ 23,552)
        run: pnpm size:guard
      - name: Dual-relayer rehearsal (consume + Replay)
        run: REQUIRE_FORGE=1 npx --yes tsx scripts/maintenance-failover.ts
      - name: Autonomous dual-relayer (deployed Gateway, no AI)
        run: REQUIRE_ANVIL=1 npx --yes tsx scripts/autonomous-relay-failover.ts
      - name: Verify committed CRE evidence / tenant-blocker (not a CRE simulate)
        run: pnpm exec tsx scripts/cre-workflow-simulate.ts --verify

  web-production-security:
    name: web-production-security
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Restricted-access UX (dev Playwright + #62 write gate)
        run: pnpm test:restricted
      - name: Production headers, bundle sentinel, browser XSS corpus
        run: pnpm test:web-security

  operator-policy-http:
    name: operator-policy-http
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Real indexer + production Next operator-policy HTTP matrix
        run: pnpm test:operator-policy-http

  web-qa:
    name: web-qa
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Visual + a11y + failure-injection gate (production next build)
        run: pnpm --filter web test:qa
        env:
          CI: "1"
          NEXT_PUBLIC_REVIEW_FIXTURES: "1"
          NEXT_PUBLIC_QA_INJECT: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web-qa
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  live-toasts-ui:
    name: live-toasts-ui
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Canonical identity + reconnect session
        run: pnpm exec tsx apps/web/src/lib/live-toasts.test.ts
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser regressions (dismiss / multi-log / reconnect / safe-area / reduced-motion)
        working-directory: apps/web
        env:
          CI: true
          NEXT_PUBLIC_REVIEW_FIXTURES: "1"
        run: pnpm exec playwright test e2e/live-toasts.spec.ts --reporter=line

  obs-ui:
    name: obs-ui
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Observability unit + source-map symbolication
        run: |
          pnpm exec tsx apps/web/src/lib/obs/redact.test.ts
          pnpm exec tsx apps/web/src/lib/obs/telemetry.test.ts
          pnpm exec tsx apps/web/src/lib/obs/failure-injection.test.ts
          pnpm exec tsx apps/web/src/lib/obs/sourcemap.test.ts
          pnpm exec tsx apps/web/src/lib/obs/vendor-proof.test.ts
      - name: Production Next build (review fixtures)
        env:
          NEXT_PUBLIC_REVIEW_FIXTURES: "1"
        run: pnpm --filter web build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Production failure-injection + Web Vitals + runbook
        working-directory: apps/web
        env:
          CI: true
          NEXT_PUBLIC_REVIEW_FIXTURES: "1"
        run: pnpm exec playwright test -c playwright.obs.config.ts e2e/obs-failure-injection.spec.ts --reporter=line

  postgres-ms-timestamps:
    name: postgres-ms-timestamps
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reactor:reactor@127.0.0.1:5432/reactor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Real Postgres millisecond BIGINT + leadership + issuance
        run: pnpm --filter indexer test:pg
      - name: Two-worker Keeper lease fencing
        run: pnpm --filter indexer test:pg-lease
      - name: Postgres smoke
        run: pnpm --filter indexer pg-smoke

  # #17 leftover extras. Full-only — never a second push+pull_request file.
  docs-links:
    name: docs-links
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Deterministic docs link check
        run: pnpm docs:links

  web:
    name: web
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright smoke + interactive + handbook copy/visual
        run: pnpm --filter web exec playwright test e2e/smoke.spec.ts e2e/interactive.spec.ts e2e/docs-copy.spec.ts e2e/docs-visual.spec.ts --reporter=line

  e2e-release-gate:
    name: e2e-release-gate
    needs: decide
    if: needs.decide.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Production build + wallet E2E (desktop + iPhone + Android)
        run: xvfb-run --auto-servernum pnpm test:e2e:release
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - decide
      - constants-version-deployments
      - page-budget
      - solidity
      - web-production-security
      - operator-policy-http
      - web-qa
      - live-toasts-ui
      - obs-ui
      - postgres-ms-timestamps
      - docs-links
      - web
      - e2e-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Required jobs executed and passed
        env:
          FULL: ${{ needs.decide.outputs.full }}
          RESULT_DECIDE: ${{ needs.decide.result }}
          RESULT_CONSTANTS: ${{ needs.constants-version-deployments.result }}
          RESULT_PAGE_BUDGET: ${{ needs.page-budget.result }}
          RESULT_SOLIDITY: ${{ needs.solidity.result }}
          RESULT_WEB_PRODUCTION_SECURITY: ${{ needs.web-production-security.result }}
          RESULT_OPERATOR_POLICY_HTTP: ${{ needs.operator-policy-http.result }}
          RESULT_WEB_QA: ${{ needs.web-qa.result }}
          RESULT_LIVE_TOASTS: ${{ needs.live-toasts-ui.result }}
          RESULT_OBS_UI: ${{ needs.obs-ui.result }}
          RESULT_POSTGRES: ${{ needs.postgres-ms-timestamps.result }}
          RESULT_DOCS_LINKS: ${{ needs.docs-links.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_E2E: ${{ needs.e2e-release-gate.result }}
        run: bash scripts/ci-ok.sh
