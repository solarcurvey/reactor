name: docs-sync

on:
  push:
  pull_request:

jobs:
  constants-version-deployments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on constants / version / deployment drift
        run: pnpm docs:check
      - name: Admission + route + launch-auth unit tests
        run: pnpm --filter indexer test

  postgres-ms-timestamps:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reactor:reactor@127.0.0.1:5432/reactor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real Postgres millisecond BIGINT + leadership + issuance
        run: pnpm --filter indexer test:pg
      - name: Postgres smoke
        run: pnpm --filter indexer pg-smoke
