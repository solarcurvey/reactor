name: docs-sync

on:
  push:
  pull_request:

# Public-fork hardening (Refs #72). Compatible with #69 three-tier CI:
# keep contents:read + persist-credentials:false when folding into ci.yml.
# No pull_request_target. No secrets in this test-only workflow.
permissions:
  contents: read

jobs:
  constants-version-deployments:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on constants / version / deployment drift
        run: pnpm docs:check
      - name: Admission + route + launch-auth unit tests
        run: pnpm --filter indexer test

  web-production-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Production headers, bundle sentinel, browser XSS corpus
        run: pnpm test:web-security

  postgres-ms-timestamps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reactor:reactor@127.0.0.1:5432/reactor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real Postgres millisecond BIGINT + leadership + issuance
        run: pnpm --filter indexer test:pg
      - name: Two-worker Keeper lease fencing
        run: pnpm --filter indexer test:pg-lease
      - name: Postgres smoke
        run: pnpm --filter indexer pg-smoke
