name: Setup Foundry
description: Foundry 1.8+ toolchain, cache, and pinned Solidity libs from foundry.lock
runs:
  using: composite
  steps:
    - uses: foundry-rs/foundry-toolchain@v1
    - uses: actions/cache@v4
      with:
        path: |
          ~/.svm
          contracts/cache
          contracts/out
        key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/foundry.lock', 'contracts/foundry.toml') }}
        restore-keys: |
          ${{ runner.os }}-foundry-
    - name: Install pinned Solidity libs
      shell: bash
      working-directory: contracts
      run: |
        set -euo pipefail
        forge --version
        forge install foundry-rs/forge-std@v1.16.2 --no-commit
        forge install Uniswap/v4-core@v4.0.0 --no-commit
        forge install Uniswap/v4-periphery@dce236d4e2057422d0791d9a973a58765eb46f65 --no-commit
        if [ ! -d lib/v4-core/lib/solmate ]; then
          git -C lib/v4-core submodule update --init --recursive
        fi
    - name: Prefetch solc 0.8.26 (retry CDN)
      shell: bash
      run: |
        set -euo pipefail
        ver=0.8.26
        if find "${HOME}/.svm" -type f \( -name "solc-0.8.26" -o -name "solc-0.8.26+*" -o -path "*0.8.26*solc*" \) 2>/dev/null | grep -q .; then
          echo "solc 0.8.26 already in ~/.svm"
          find "${HOME}/.svm" -type f -name "solc*" | head
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          echo "svm install ${ver} (attempt ${attempt})"
          if command -v svm >/dev/null && svm install "${ver}"; then
            exit 0
          fi
          echo "svm install failed; retrying after $((attempt * 4))s" >&2
          sleep $((attempt * 4))
        done
        echo "failed to download solc ${ver} from binaries.soliditylang.org after retries" >&2
        exit 1
