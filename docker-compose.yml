# Local Postgres for the indexer. SQLite remains the default without DATABASE_URL.
#   docker compose up -d postgres
#   DATABASE_URL=postgres://reactor:reactor@127.0.0.1:54329/reactor pnpm --filter indexer pg-smoke
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reactor
      POSTGRES_PASSWORD: reactor
      POSTGRES_DB: reactor
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactor -d reactor"]
      interval: 2s
      timeout: 5s
      retries: 20
