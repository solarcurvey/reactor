[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../apps/web/src/lib/deployment.json" },
  { access = "read-write", path = "../apps/indexer/src/deployment.json" },
  { access = "read-write", path = "../ops/cre/simulation" },
]
verbosity = 2

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
